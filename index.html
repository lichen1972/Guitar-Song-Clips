<style>
:root{
  /* palette from the reference image */
  --bg:#e8e2d4; --panel:#f5f1e8; --panel2:#ece6d8; --line:#d6cdb9;
  --ink:#232323; --muted:#6e685c; --brass:#e8692b; --brass-ink:#ffffff;
  --teal:#1e8db3; --sun:#f2b134; --nav:#232323; --nav-ink:#f5f1e8;
  --male:#1e8db3; --female:#d9542a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1c1a; --panel:#282624; --panel2:#33302c; --line:#45413b;
  --ink:#efe9dc; --muted:#a8a194; --brass:#f07a3e; --brass-ink:#1d1c1a;
  --teal:#3fb0d6; --sun:#f5bf52; --nav:#111111; --nav-ink:#efe9dc; --male:#3fb0d6; --female:#f07a3e;
}}
:root[data-theme="dark"]{
  --bg:#1d1c1a; --panel:#282624; --panel2:#33302c; --line:#45413b;
  --ink:#efe9dc; --muted:#a8a194; --brass:#f07a3e; --brass-ink:#1d1c1a;
  --teal:#3fb0d6; --sun:#f5bf52; --nav:#111111; --nav-ink:#efe9dc; --male:#3fb0d6; --female:#f07a3e;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.days{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.day{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.day:hover{background:var(--panel2);color:var(--ink)}
.day.on{background:var(--brass);color:var(--brass-ink)}
.day.today:not(.on){box-shadow:inset 0 -2px 0 var(--brass)}
.mode{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}

aside{border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;background:var(--panel)}
aside h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px 8px}
.cats{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.cat{display:flex;justify-content:space-between;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px}
.cat:hover{background:var(--panel2)}
.cat.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--brass);font-weight:600}
.cat .n{color:var(--muted);font-size:13px}
.search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin-bottom:18px}

main{overflow-y:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-content:start}
.stage{position:sticky;top:0;align-self:start}
.screen{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}
.screen iframe{width:100%;height:100%;border:0;display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#c8c3b5;text-align:center;padding:20px}
.empty p{margin:0;max-width:36ch}
.now{display:flex;align-items:center;gap:10px;margin:14px 0 8px}
.now h1{font-size:22px;margin:0;flex:1;line-height:1.25}
.chord{display:inline-block;min-width:34px;text-align:center;padding:2px 7px;border-radius:6px;border:1px solid var(--brass);color:var(--brass);font-weight:600;font-size:13px}
.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.linkrow{display:flex;gap:6px;margin-top:10px}
.linkrow input{flex:1;min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.note{font-size:12px;color:var(--muted);margin-top:6px;min-height:1em}

.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#songs{max-height:calc(100vh - 140px);overflow-y:auto;overscroll-behavior:contain}
main.full #songs{max-height:none;overflow:visible}
main{min-height:0}
.list-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list-head b{font-size:16px}
.list-head span{color:var(--muted);font-size:13px}
.song{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:9px 14px}
.song:last-child{border-bottom:0}
.song:hover{background:var(--panel2)}
.song.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--brass)}
.song .ic{color:var(--muted);font-size:12px;text-align:center}
.song .ic.has{color:var(--brass)}
.song .t{font-weight:500;font-size:14px}
.song .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.v-Male{color:var(--male)} .v-Female{color:var(--female)}
.none{padding:24px 14px;color:var(--muted)}


.song{grid-template-columns:22px 1fr auto auto;cursor:pointer}
.pen{border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:15px;line-height:1}
.pen:hover{color:var(--brass);background:var(--bg)}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.tag{font-size:11px;padding:0 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.cmt{font-size:11px;color:var(--muted)}
.full-wrap{display:grid;grid-template-columns:1fr 30px}
.full-body{max-height:calc(100vh - 150px);overflow-y:auto}
.letter{position:sticky;top:0;background:var(--panel2);padding:4px 14px;font-weight:800;color:var(--brass);font-size:14px;z-index:1}
.rail{display:flex;flex-direction:column;align-items:center;border-left:1px solid var(--line);padding:4px 0;max-height:calc(100vh - 150px);overflow-y:auto}
.rail button{border:0;background:transparent;font-size:12px;font-weight:600;padding:2px 0;width:100%;color:var(--brass)}
.rail button:disabled{color:var(--line);cursor:default}
.rail button:not(:disabled):hover{background:var(--panel2)}
main.full{grid-template-columns:minmax(0,1fr) minmax(320px,1.2fr)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,12,20,.6)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto}
.dlg h3{margin:0 0 4px;font-size:18px}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.dlg input,.dlg select,.dlg textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.clist{display:flex;flex-direction:column;gap:6px}
.citem{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.citem span{flex:1;white-space:pre-wrap;color:var(--ink)}
.citem small{color:var(--muted);display:block}
.err{color:#e0656a;font-size:13px;min-height:1em}
@media (max-width:860px){
  main.full{grid-template-columns:1fr}
  #songs{max-height:70vh}
  .full-body,.rail{max-height:70vh}

  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100%}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  aside h2,.voices-h{display:none}
  .cats{flex-direction:row;overflow-x:auto;margin-bottom:8px}
  .cat{white-space:nowrap;gap:6px}
  .search{margin-bottom:4px}
  main{grid-template-columns:1fr;overflow:visible}
  .stage{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* themed chrome */
header{background:var(--nav);color:var(--nav-ink);border-bottom:4px solid var(--teal)}
.brand{font-family:"Courgette","Brush Script MT",cursive;font-weight:400;font-size:24px}
.brand small{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#bdb6a6}
header .day{color:#bdb6a6}
header .day:hover{background:#3a3a3a;color:#fff}
header .day.today:not(.on){box-shadow:inset 0 -2px 0 var(--sun)}
header .btn{background:transparent;border-color:#555;color:var(--nav-ink)}
header .btn:hover{border-color:var(--sun)}
header .btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chord{border-color:var(--teal);color:var(--teal)}
.song .ic.has{color:var(--brass)}
.letter{color:var(--teal)}
.rail button{color:var(--teal)}
.now h1{font-family:"Be Vietnam Pro",system-ui,sans-serif}
.list-head{border-bottom:3px solid var(--sun)}
.cat.on{box-shadow:inset 4px 0 0 var(--brass)}
.tag{background:var(--sun);border-color:var(--sun);color:#232323}
#playAll.on{background:var(--brass);border-color:var(--brass)}
#repBtn.on,#shufBtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.screen{border:3px solid var(--nav)}
.welcome{width:100%;height:100%;object-fit:cover;display:block}
.dlg .row2>label{min-width:0}
.dlg select{width:100%;min-width:0}
.btn.add{width:100%;margin:-8px 0 18px;background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.danger{background:transparent;border-color:#c0392b;color:#c0392b}
.btn.danger.confirm{background:#c0392b;color:#fff}
.removed-h{color:var(--muted)!important;margin-top:8px}
.song.removed{grid-template-columns:22px 1fr auto auto;opacity:.75;cursor:default}
.btn.restore{padding:3px 10px;font-size:12px}
@media (max-width:860px){.btn.add{margin:0 0 8px}}
.brand .sig{display:block;font-family:"Courgette","Brush Script MT",cursive;font-size:13px;color:var(--sun);margin-top:-2px}
.count{font-size:12px;color:var(--muted);margin:-10px 0 16px 4px}
.welcome-sig{position:absolute;right:5%;bottom:7%;font-family:"Courgette","Brush Script MT",cursive;font-size:clamp(18px,3.4vw,34px);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
@media (max-width:860px){.count{margin:0 0 6px 4px}}
.logo{width:40px;height:40px;border-radius:9px;flex:none;margin-right:-6px}
.btn.small{padding:4px 10px;font-size:12px}
.list-head{align-items:center}
.mv{display:flex;gap:2px}
.mv .pen{font-size:12px;padding:5px 7px;border:1px solid var(--line)}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1;padding:4px 8px;color:var(--teal);border-radius:6px}
.grip:hover{background:var(--bg)}
.song.dragging{background:var(--panel2);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 4px 0 0 var(--brass);position:relative;z-index:2;cursor:grabbing}
.song.dragging .grip{cursor:grabbing}
.song.sel{background:var(--panel2);box-shadow:inset 4px 0 0 var(--teal);outline:2px solid var(--teal);outline-offset:-2px}
#mvUp:disabled,#mvDown:disabled{opacity:.4;cursor:default}
.empty.nolink{background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.home{display:flex;align-items:center;gap:16px;color:inherit;text-decoration:none;border-radius:10px}
.home:hover .brand{color:var(--sun)}
/* list fits the window; whole rows; scroll buttons */
.list-foot{display:flex;gap:6px;justify-content:center;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
.list-foot .btn{min-width:44px}
#songs,.full-body{scroll-snap-type:y proximity;scrollbar-width:thin;scrollbar-color:var(--teal) transparent}
.full-body{scroll-padding-top:30px}
.song{scroll-snap-align:start}
#songs::-webkit-scrollbar,.full-body::-webkit-scrollbar{width:10px}
#songs::-webkit-scrollbar-thumb,.full-body::-webkit-scrollbar-thumb{background:var(--teal);border-radius:10px;border:2px solid var(--panel)}
#songs::-webkit-scrollbar-track,.full-body::-webkit-scrollbar-track{background:transparent}
@media (min-width:861px){
  main{overflow:hidden;height:100%;grid-template-rows:minmax(0,1fr);align-content:stretch}
  .stage{position:static;overflow-y:auto;max-height:100%;align-self:start}
  .list{display:flex;flex-direction:column;min-height:0;height:100%}
  #songs{flex:1;min-height:0;max-height:none}
  main.full #songs{overflow:hidden}
  .full-wrap{height:100%}
  .full-body,.rail{max-height:none;height:100%}
}
[hidden]{display:none!important}
.list-head{flex-wrap:wrap;row-gap:8px}
.scrollnav{display:flex;gap:6px}
.scrollnav .scr-step{min-width:40px}
.btn.mvbtn{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.dicebtn{width:100%;margin:-8px 0 18px;background:var(--teal);border-color:var(--teal);color:#fff}
.dice-dlg{width:min(440px,94vw);border:3px solid var(--nav);border-radius:18px}
.dice{align-items:stretch;gap:12px;padding:20px 22px}
.dice-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dice-nav{border:0;background:transparent;font-weight:800;font-size:16px;color:var(--brass);padding:4px 2px}
.dice-nav:disabled{opacity:.35;cursor:default}
.dice-label{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
#dIcon{display:inline-block}
#dIcon.spin{animation:dspin .6s ease-out}
@keyframes dspin{from{transform:rotate(-360deg) scale(.6)}to{transform:none}}
.dice-badges{display:flex;justify-content:center;gap:6px}
.dchord{background:var(--teal);color:#fff;font-weight:800;padding:6px 14px;border-radius:8px;min-width:44px;text-align:center}
.dvoice{background:var(--nav);color:#fff;font-weight:800;padding:6px 10px;border-radius:8px;min-width:36px;text-align:center}
.dvoice.vFemale{background:var(--female)} .dvoice.vMale{background:var(--male)}
.dice-title{text-align:center;font-size:21px;font-weight:800;line-height:1.3;margin:2px 0 0}
.dice-meta{text-align:center;color:var(--muted);font-size:13px;margin-bottom:4px}
.btn.dbig{padding:12px;font-size:15px;border-width:2px;border-color:var(--nav);background:var(--panel);border-radius:10px}
.btn.dplay{background:var(--brass);border-color:var(--nav);color:#fff}
.btn.dagain{background:var(--sun);color:#232323}
.btn.dback{border-color:var(--line);color:var(--muted);background:transparent}
@media (max-width:860px){.btn.dicebtn{margin:0 0 8px}}
@media (prefers-reduced-motion:reduce){#dIcon.spin{animation:none}}

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let SONGS = [], byId = {};
const collator = new Intl.Collator("vi");
let REMOVED = [];
function rebuild(){
  const baseIds = new Set(BASE.map(b=>b.id));
  const added = Object.entries(edits).filter(([id,e])=>!baseIds.has(id) && e && e.added && e.n).map(([id,e])=>({id,n:e.n,c:"",d:"Any",v:""}));
  const all = [...BASE, ...added].map(b=>{const e=edits[b.id]||{}; return {...b, ...e, id:b.id, c:e.c??b.c??"", tags:e.tags||[], comments:e.comments||[]};});
  byId = Object.fromEntries(all.map(s=>[s.id,s]));
  SONGS = all.filter(s=>!s.removed);
  REMOVED = all.filter(s=>s.removed).sort((a,b)=>collator.compare(a.n,b.n));
  if(current) current = byId[current.id];
}
let mode = "daily";
let mix = store.get("gsv_mix",null);
const todayIdx = (new Date().getDay()+6)%7;
let day = DAYS[todayIdx];
let cat = "all", voice = "all", tag = "all", q = "";

let repeat = store.get("gsv_repeat","off");   // off | all | one
let shufOn = store.get("gsv_shuf",false);
let queue = null;   // {title, ids:[song ids], pos}
let db = null;
let unlocked = (()=>{try{return sessionStorage.getItem("gsv_ok")==="1"}catch(e){return false}})();
rebuild();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function letterOf(name){
  const ch = (name||"").trim().charAt(0).toUpperCase();
  if(ch==="Đ") return "Đ";
  const b = ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return /[A-Z]/.test(b) ? b : "#";
}
const LETTERS = ["#","A","B","C","D","Đ",..."EFGHIJKLMNOPQRSTUVWXYZ".split("")];

function ytId(u){
  if(!u) return null;
  const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/) || String(u).match(/^([\w-]{11})$/);
  return m ? m[1] : null;
}
function shuffleWeek(){
  const ids = SONGS.map(s=>s.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const g = Object.fromEntries(DAYS.map(d=>[d,[]]));
  ids.forEach((id,i)=>g[DAYS[i%7]].push(id));
  mix = g; store.set("gsv_mix",mix);
}
function daySongs(){
  if(mode==="mix"){ if(!mix) shuffleWeek(); return (mix[day]||[]).map(id=>byId[id]).filter(s=>s && !s.removed); }
  return SONGS.filter(s=>s.d===day);
}
const wide = () => mode==="full" || (mode==="daily" && (q.trim() || cat!=="all" || tag!=="all"));
// Search ignores Vietnamese accents: "giot nang" finds "Giọt Nắng"
const plain = x => String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/\s+/g," ");
function matches(s){
  const t = plain(q.trim());
  const hay = plain(s.n+" "+s.tags.join(" ")+" "+s.comments.map(c=>c.t).join(" "));
  return (cat==="all"||s.d===cat)&&(voice==="all"||(voice==="Instrument"?!s.v:s.v===voice))&&(tag==="all"||s.tags.includes(tag))
    &&(!t||hay.includes(t)||s.c.toLowerCase()===t);
}
let orders = store.get("gsv_order",{});   // category -> [song ids]
let reorderOn = false, selId = null;
function orderCat(){ // the single category the list shows, if any
  if(mode!=="daily" || q.trim() || tag!=="all") return null;
  return cat!=="all" ? cat : day;
}
const canReorder = () => !!orderCat() && voice==="all";
function visible(){
  const list = (wide() ? SONGS : daySongs()).filter(matches);
  if(mode==="full") return list.slice().sort((a,b)=>collator.compare(a.n,b.n));
  const k = orderCat();
  if(k && orders[k]){ const rank = new Map(orders[k].map((id,i)=>[id,i])); const base = new Map(list.map((s,i)=>[s.id,i]));
    return list.slice().sort((a,b)=>(rank.has(a.id)?rank.get(a.id):1e6+base.get(a.id))-(rank.has(b.id)?rank.get(b.id):1e6+base.get(b.id))); }
  return list;
}
let orderTimer = null;
function moveSong(id, dir){
  const k = orderCat(); if(!k) return;
  const list = visible(); const i = list.findIndex(s=>s.id===id); const j = i+dir;
  if(i<0 || j<0 || j>=list.length) return;
  const ids = list.map(s=>s.id); [ids[i],ids[j]]=[ids[j],ids[i]];
  orders[k] = ids; store.set("gsv_order",orders); renderList();
  const row = document.querySelector(`.song[data-id="${id}"]`); if(row) row.scrollIntoView({block:"nearest"});
  saveOrder(k);
}
function saveOrder(k){
  clearTimeout(orderTimer);
  orderTimer = setTimeout(async ()=>{
    if(!db){ $("note").textContent="Order saved."; return; }
    try{ await db.doc("order/"+k).set({ids:orders[k]}); $("note").textContent="Order saved for everyone."; }
    catch(e){ $("note").textContent="Order saved on this device only (shared save not allowed)."; }
  }, 700);
}

  const tabs = mode==="mix" ? DAYS : [...DAYS,"Any"];
  if(mode==="mix" && day==="Any") day = DAYS[todayIdx];
  $("days").innerHTML = tabs.map((d,i)=>`<button class="day ${d===day&&mode!=="full"?"on":""} ${i===todayIdx&&d!=="Any"?"today":""}" data-d="${d}">${d==="Any"?"Misc":d}</button>`).join("");
  $("mMix").classList.toggle("on",mode==="mix");
  $("mFull").classList.toggle("on",mode==="full");
  $("reshuffle").hidden = mode!=="mix";
  document.querySelector("main").classList.toggle("full",mode==="full");
}
function renderSide(){
  const base = mode==="mix" ? daySongs() : SONGS;
  const cnt = k => base.filter(s=>k==="all"||s.d===k).length;
  $("cats").innerHTML = ["all",...Object.keys(CATS)].map(k=>`<button class="cat ${k===cat?"on":""}" data-c="${k}"><span>${k==="all"?"ALL":CATS[k]}</span><span class="n">${cnt(k)}</span></button>`).join("");
  $("voices").innerHTML = [["Female","Female"],["Male","Male"],["Instrument","Instrument"]].map(([k,l])=>`<button class="cat ${k===voice?"on":""}" data-v="${k}" aria-pressed="${k===voice}"><span>${l}</span><span class="n">${base.filter(s=>k==="Instrument"?!s.v:s.v===k).length}</span></button>`).join("");
  const tc = {}; base.forEach(s=>s.tags.forEach(t=>tc[t]=(tc[t]||0)+1));
  const tags = Object.keys(tc).sort(collator.compare);
  if(tag!=="all" && !tc[tag]) tag="all";
  $("tagsH").hidden = !tags.length;
  $("tagsBox").innerHTML = tags.length ? ["all",...tags].map(k=>`<button class="cat ${k===tag?"on":""}" data-t="${esc(k)}"><span>${k==="all"?"All tags":"#"+esc(k)}</span><span class="n">${k==="all"?"":tc[k]}</span></button>`).join("") : "";
}
function rowHTML(s){
  const has = ytId(links[s.id]);
  return `<div class="song ${current&&current.id===s.id?"on":""} ${reorderOn&&selId===s.id?"sel":""}" data-id="${s.id}" role="button" tabindex="0">
    <span class="ic ${has?"has":""}">${has?"▶":"○"}</span>
    <span class="t">${esc(s.n)}<span class="sub">${CATS[s.d]||""}${s.v?` <span class="v-${s.v}">${s.v}</span>`:""}${s.tags.length?`<span class="tags">${s.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</span>`:""}${s.comments.length?` <span class="cmt">💬 ${s.comments.length}</span>`:""}</span></span>
    <span class="chord">${esc(s.c)}</span>
    ${reorderOn && canReorder() ? `<span class="mv"><span class="grip" data-drag="${s.id}" title="Hold and drag to move" aria-hidden="true">⠿</span></span>` : `<button class="pen" data-edit="${s.id}" title="Edit song" aria-label="Edit ${esc(s.n)}">✏️</button>`}</div>`;
}
function renderList(){
  const rb = $("reorderBtn"); rb.hidden = !canReorder(); if(!canReorder()) reorderOn = false;
  rb.textContent = reorderOn ? "✓ Done" : "↕ Reorder"; rb.classList.toggle("on", reorderOn);
  $("mvUp").hidden = $("mvDown").hidden = !reorderOn;
  document.querySelectorAll(".scr-step").forEach(b=>b.hidden = reorderOn);
  $("mvUp").disabled = $("mvDown").disabled = !selId;
  const list = visible();
  let title;
  if(mode==="full") title = "Full list A–Z";
  else if(wide()) title = "All days";
  else title = (day==="Any"?"Misc":day)+(mode==="mix"?" (shuffled)":"");
  if(cat!=="all") title += " / "+CATS[cat];
  if(tag!=="all") title += " / #"+tag;
  $("listTitle").textContent = title;
  $("listCount").textContent = list.length+" songs";
  const removedHTML = (mode==="full" && REMOVED.length) ? `<div class="letter removed-h">Removed songs (${REMOVED.length})</div>${REMOVED.map(s=>`<div class="song removed"><span class="ic">✕</span><span class="t">${esc(s.n)}<span class="sub">${CATS[s.d]||""}</span></span><span class="chord">${esc(s.c)}</span><button class="btn restore" data-restore="${s.id}">Restore</button></div>`).join("")}` : "";
  if(!list.length){ $("songs").innerHTML = `<div class="none">No songs match. Clear the search or pick another filter.</div>`+removedHTML; }
  else if(mode==="full"){
    const groups = {}; list.forEach(s=>{(groups[letterOf(s.n)] ||= []).push(s);});
    const body = LETTERS.filter(L=>groups[L]).map(L=>`<div class="letter" id="L-${L}">${L}</div>${groups[L].map(rowHTML).join("")}`).join("") + removedHTML;
    const rail = LETTERS.map(L=>`<button data-l="${L}" ${groups[L]?"":"disabled"}>${L}</button>`).join("");
    $("songs").innerHTML = `<div class="full-wrap"><div class="full-body" id="fullBody">${body}</div><nav class="rail" id="rail" aria-label="Jump to letter">${rail}</nav></div>`;
  } else $("songs").innerHTML = list.map(rowHTML).join("");
  const linked = SONGS.filter(s=>ytId(links[s.id])).length;
  $("count").textContent = `${SONGS.length} songs, ${linked} with video`;
}
// Never auto-start videos: they play only when you press ▶ (all devices)
const NO_AUTOPLAY = true;
function embed(vids, auto, title){
  let p = "rel=0" + (auto && !NO_AUTOPLAY ? "&autoplay=1" : "");
  const rest = vids.slice(1);
  if(repeat==="one" && vids.length===1) p += "&loop=1&playlist="+vids[0];
  else if(repeat!=="off" && vids.length>1) p += "&loop=1&playlist="+rest.join(",");
  else if(repeat!=="off") p += "&loop=1&playlist="+vids[0];
  else if(rest.length) p += "&playlist="+rest.join(",");
  return `<iframe data-vid="${vids.join(",")}" src="https://www.youtube-nocookie.com/embed/${vids[0]}?${p}" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}
function renderCtl(){
  $("shufBtn").classList.toggle("on",shufOn); $("shufBtn").setAttribute("aria-pressed",shufOn);
  $("repBtn").textContent = "🔁 Repeat: "+({off:"Off",all:"All",one:"One"})[repeat];
  $("repBtn").classList.toggle("on",repeat!=="off");
  $("playAll").textContent = queue ? "■ Stop list" : "▶ Play all";
}
function renderQueue(){
  const ids = queue.ids.slice(queue.pos).concat(repeat!=="off" ? queue.ids.slice(0,queue.pos) : []);
  const vids = ids.map(id=>ytId(links[id]));
  const s = byId[queue.ids[queue.pos]];
  $("title").textContent = s.n;
  $("chord").hidden=false; $("chord").textContent=s.c; $("penNow").hidden=false;
  $("meta").innerHTML = `▶ Playing all: ${esc(queue.title)}, song ${queue.pos+1} of ${queue.ids.length}${shufOn?" (random order)":""}${queue.skipped?`, ${queue.skipped} without video skipped`:""}. Title may lag once YouTube moves to the next video.`;
  $("yt").href = "https://www.youtube.com/results?search_query="+encodeURIComponent(s.n+" guitar");
  $("link").value = links[s.id]||"";
  $("screen").innerHTML = embed(vids, true, queue.title);
  if(!current || current.id!==s.id) bumpPlay(s.id);
  current = s; renderCtl(); renderList();
}
function startQueue(){
  const list = visible();
  let ids = list.filter(s=>ytId(links[s.id])).map(s=>s.id);
  if(!ids.length){ $("note").textContent = "No song in this list has a video link yet. Add links with ✏️ or the box below."; return; }
  if(shufOn) for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  queue = {title:$("listTitle").textContent, ids, pos:0, skipped:list.length-ids.length};
  $("note").textContent=""; renderQueue();
}
function stopQueue(){ queue=null; renderCtl(); renderPlayer(false); }
function renderPlayer(auto){
  const s = current;
  if(!s){ $("screen").innerHTML = `<img class="welcome" src="${WELCOME_IMG}" alt="Guitarist writing a song beside a laptop"><div class="welcome-sig">For friends and music lovers</div>`; return; }
  if(queue) return;
  $("title").textContent = s.n;
  $("chord").hidden = false; $("chord").textContent = s.c;
  $("penNow").hidden = false;
  $("meta").innerHTML = (CATS[s.d]||"") + (s.v?` / <span class="v-${s.v}">${s.v}</span>`:"") + (s.tags.length?" / "+s.tags.map(t=>"#"+esc(t)).join(" "):"");
  $("yt").href = "https://www.youtube.com/results?search_query="+encodeURIComponent(s.n+" guitar");
  $("link").value = links[s.id]||"";
  const id = ytId(links[s.id]);
  const cur = document.querySelector(".screen iframe");
  if(id && cur && cur.dataset.vid===id && !auto) return;
  $("screen").innerHTML = id
    ? embed([id], auto, s.n)
    : `<div class="empty nolink" style="background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url(${NOLINK_IMG})"><p>No video link yet for this song.</p><p style="font-size:13px;opacity:.8">Use “Find on YouTube”, copy the video link, paste it below and save.</p></div>`;
}
function play(s,auto=true){ if(queue){queue=null; renderCtl();} if(s && (!current || current.id!==s.id)) bumpPlay(s.id); current = s; renderPlayer(auto); renderList(); }
function step(dir){
  if(queue){ const n=queue.ids.length; queue.pos=(queue.pos+dir+n)%n; renderQueue(); return; }
  const list = visible(); if(!list.length) return;
  if(shufOn && list.length>1){ let r; do{ r=list[Math.floor(Math.random()*list.length)]; }while(current && r.id===current.id); play(r); return; }
  const i = current ? list.findIndex(s=>s.id===current.id) : -1;
  play(list[(i+dir+list.length)%list.length]);
}
function renderAll(){ renderDays(); renderSide(); renderList(); }

/* ---------- password gate ---------- */
function requireUnlock(then){
  if(unlocked) return then();
  $("pw").value=""; $("pwErr").textContent="";
  $("pwDlg")._then = then; $("pwDlg").showModal(); $("pw").focus();
}
$("pwForm").onsubmit = e=>{
  e.preventDefault();
  if($("pw").value===PASS){ unlocked=true; try{sessionStorage.setItem("gsv_ok","1")}catch(_){}; $("pwDlg").close(); const f=$("pwDlg")._then; f&&f(); }
  else $("pwErr").textContent="Wrong password. Try again.";
};
$("pwCancel").onclick = ()=>$("pwDlg").close();

/* ---------- editor ---------- */
let editing = null, editingNew = false, draftComments = [];
$("eCat").innerHTML = Object.entries(CATS).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("");
function renderCmts(){
  $("eCmts").innerHTML = draftComments.length ? draftComments.map((c,i)=>`<div class="citem"><span>${esc(c.t)}<small>${new Date(c.at).toLocaleString()}</small></span><button type="button" class="pen" data-del="${i}" title="Delete comment">🗑</button></div>`).join("") : `<div class="cmt">No comments yet.</div>`;
}
$("eCmts").onclick = e=>{const b=e.target.closest("[data-del]"); if(b){draftComments.splice(+b.dataset.del,1); renderCmts();}};
function openEditor(id){
  requireUnlock(()=>{
    const isNew = !id;
    if(isNew){ id = "u"+Date.now().toString(36); }
    const s = isNew ? {n:"",c:"",d:(mode==="daily"&&day)||"Any",v:"",tags:[],comments:[]} : byId[id];
    editing = id; editingNew = isNew;
    $("edTitle").textContent = isNew ? "Add song" : "Edit song";
    $("edRemove").hidden = isNew; $("edRemove").classList.remove("confirm"); $("edRemove").textContent="Remove from list";
    $("eName").value=s.n; $("eChord").value=s.c; $("eCat").value=s.d; $("eVoice").value=s.v||"";
    $("eLink").value=links[id]||""; $("eTags").value=s.tags.join(", "); $("eNewCmt").value=""; $("edErr").textContent="";
    draftComments = s.comments.map(c=>({...c})); renderCmts();
    $("edDlg").showModal();
  });
}
$("edCancel").onclick = ()=>$("edDlg").close();
$("edForm").onsubmit = async e=>{
  e.preventDefault();
  const url = $("eLink").value.trim();
  if(url && !ytId(url)){ $("edErr").textContent="The YouTube link isn't a video link. Copy the address of a video page."; return; }
  const nc = $("eNewCmt").value.trim();
  if(nc) draftComments.push({t:nc, at:Date.now()});
  const tags = [...new Set($("eTags").value.split(",").map(x=>x.trim().replace(/^#/,"")).filter(Boolean))];
  const name = $("eName").value.trim();
  if(!name){ $("edErr").textContent="Enter a song name."; return; }
  const rec = {n:name, c:$("eChord").value.trim(), d:$("eCat").value, v:$("eVoice").value, tags, comments:draftComments};
  if(editingNew || (edits[editing]&&edits[editing].added)) rec.added = true;
  const id = editing;
  $("edDlg").close();
  await saveSong(id, rec, url, true);
  if(editingNew) play(byId[id], !!ytId(url));
};
async function saveSong(id, rec, url, touchLink){
  edits[id]=rec; store.set("gsv_edits",edits);
  if(touchLink){ if(url) links[id]=url; else delete links[id]; store.set("gsv_links",links); }
  rebuild(); renderAll(); if(current&&current.id===id) renderPlayer(false);
  if(db){
    try{
      await db.doc("songs/"+id).set(rec);
      if(touchLink) url ? await db.doc("links/"+id).set({url}) : await db.doc("links/"+id).delete().catch(()=>{});
      $("note").textContent="Saved for everyone.";
    }catch(err){ $("note").textContent="Saved on this device only (shared save not allowed)."; }
  } else $("note").textContent="Saved.";
}
$("edRemove").onclick = async ()=>{
  const b=$("edRemove");
  if(!b.classList.contains("confirm")){ b.classList.add("confirm"); b.textContent="Click again to remove"; return; }
  const id=editing, s=byId[id];
  const {id:_i, ...rest} = s;
  $("edDlg").close();
  if(current && current.id===id){ current=null; queue=null; renderCtl(); $("title").textContent="Pick a song"; $("chord").hidden=true; $("penNow").hidden=true; $("meta").textContent=""; renderPlayer(false); }
  await saveSong(id, {...rest, removed:true}, null, false);
  $("note").textContent = `Removed “${s.n}”. Restore it at the bottom of ☰ Full list.`;
};
/* drag to reorder (mouse + touch) */
let drag = null;
$("songs").addEventListener("pointerdown", e=>{
  const g = e.target.closest("[data-drag]"); if(!g || !reorderOn) return;
  e.preventDefault();
  const row = g.closest(".song");
  drag = {row, box:$("songs"), y:e.clientY, id:g.dataset.drag};
  row.classList.add("dragging");
  g.setPointerCapture(e.pointerId);
});
$("songs").addEventListener("pointermove", e=>{
  if(!drag) return;
  const {row, box} = drag;
  const y = e.clientY;
  // auto-scroll near edges of the list
  const r = box.getBoundingClientRect();
  if(y < r.top+40) box.scrollTop -= 12; else if(y > r.bottom-40) box.scrollTop += 12;
  const prev = row.previousElementSibling, next = row.nextElementSibling;
  if(prev && prev.classList.contains("song") && y < prev.getBoundingClientRect().top + prev.offsetHeight/2) box.insertBefore(row, prev);
  else if(next && next.classList.contains("song") && y > next.getBoundingClientRect().top + next.offsetHeight/2) box.insertBefore(next, row);
});
function endDrag(){
  if(!drag) return;
  drag.row.classList.remove("dragging");
  const k = orderCat();
  const ids = [...$("songs").querySelectorAll(".song[data-id]")].map(r=>r.dataset.id);
  drag = null;
  if(k){ orders[k] = ids; store.set("gsv_order",orders); saveOrder(k); }
  renderList();
}
$("songs").addEventListener("pointerup", endDrag);
$("songs").addEventListener("pointercancel", endDrag);
$("mvUp").onclick = ()=>selId&&moveSong(selId,-1);
$("mvDown").onclick = ()=>selId&&moveSong(selId,1);
$("reorderBtn").onclick = ()=>{ if(reorderOn){ reorderOn=false; selId=null; renderList(); } else requireUnlock(()=>{ reorderOn=true; selId=current?current.id:null; $("note").textContent="Hold ⠿ and drag a song, or tap a song and use ▲ ▼ at the top of the list. Press Done when finished."; renderList(); }); };
$("scrollNav").onclick = e=>{
  const b=e.target.closest("[data-scr]"); if(!b) return;
  const box = (mode==="full" && $("fullBody")) ? $("fullBody") : $("songs");
  const page = Math.max(80, box.clientHeight*0.85);
  const k=b.dataset.scr;
  if(k==="top") box.scrollTo({top:0,behavior:"smooth"});
  else if(k==="bottom") box.scrollTo({top:box.scrollHeight,behavior:"smooth"});
  else box.scrollBy({top:k==="up"?-page:page,behavior:"smooth"});
};
$("home").onclick = e=>{
  e.preventDefault();
  mode="daily"; day=DAYS[todayIdx]; cat="all"; voice="all"; tag="all"; q=""; $("q").value="";
  reorderOn=false; selId=null;
  renderAll();
  const box=$("songs"); if(box) box.scrollTop=0;
  window.scrollTo({top:0,behavior:"smooth"});
};
/* ---------- play counts + roll the dice ---------- */
let plays = store.get("gsv_plays",{});
function bumpPlay(id){
  plays[id]=(plays[id]||0)+1; store.set("gsv_plays",plays);
  if(db){ try{ db.doc("plays/"+id).set({n:plays[id]}); }catch(e){} }
}
const DAYNAME = {Mon:"Mon",Tue:"Tue",Wed:"Wed",Thu:"Thu",Fri:"Fri",Sat:"Sat",Sun:"Sun",Any:"Misc"};
let rollHist = [], rollPos = -1, rollSeen = new Set();
function rollOne(){
  let pool = SONGS.filter(s=>!rollSeen.has(s.id));
  if(!pool.length){ rollSeen.clear(); pool = SONGS.slice(); }
  const min = Math.min(...pool.map(s=>plays[s.id]||0));
  const cands = pool.filter(s=>(plays[s.id]||0)===min);
  const pick = cands[Math.floor(Math.random()*cands.length)];
  rollSeen.add(pick.id); rollHist = rollHist.slice(0,rollPos+1); rollHist.push(pick.id); rollPos = rollHist.length-1;
}
function showRoll(anim){
  const s = byId[rollHist[rollPos]]; if(!s) return;
  $("dChord").textContent = s.c || "–";
  $("dVoice").textContent = s.v==="Female" ? "♀" : s.v==="Male" ? "♂" : "🎸";
  $("dVoice").title = s.v || "Instrument"; $("dVoice").className = "dvoice v"+(s.v||"I");
  $("dTitle").textContent = s.n;
  const n = plays[s.id]||0;
  $("dMeta").textContent = `Day: ${DAYNAME[s.d]||s.d}  ·  ${CATS[s.d]||""}  ·  ${n===0?"never played":"played "+n+(n===1?" time":" times")}${ytId(links[s.id])?"":"  ·  no video yet"}`;
  $("dLast").disabled = rollPos<=0;
  if(anim){ const i=$("dIcon"); i.classList.remove("spin"); void i.offsetWidth; i.classList.add("spin"); }
}
$("rollBtn").onclick = ()=>{ if(!SONGS.length) return; rollOne(); showRoll(true); $("diceDlg").showModal(); };
$("dNext").onclick = ()=>{ if(rollPos < rollHist.length-1) rollPos++; else rollOne(); showRoll(true); };
$("dAgain").onclick = ()=>{ rollOne(); showRoll(true); };
$("dLast").onclick = ()=>{ if(rollPos>0){ rollPos--; showRoll(false); } };
$("dPlay").onclick = ()=>{ const s=byId[rollHist[rollPos]]; $("diceDlg").close(); if(s) play(s); };
$("dEdit").onclick = ()=>{ const id=rollHist[rollPos]; $("diceDlg").close(); openEditor(id); };
$("dBack").onclick = ()=>$("diceDlg").close();
$("diceDlg").addEventListener("click", e=>{ if(e.target===$("diceDlg")) $("diceDlg").close(); });
$("addSong").onclick = ()=>openEditor(null);

/* ---------- events ---------- */
$("days").onclick = e=>{const b=e.target.closest("[data-d]"); if(!b) return; day=b.dataset.d; if(mode==="full"){mode="daily";store.set("gsv_mode",mode);} cat="all"; tag="all"; q=""; $("q").value=""; renderAll();};
$("cats").onclick = e=>{const b=e.target.closest("[data-c]"); if(!b) return; cat=b.dataset.c; renderAll();};
$("voices").onclick = e=>{const b=e.target.closest("[data-v]"); if(!b) return; voice = voice===b.dataset.v ? "all" : b.dataset.v; renderAll();};
$("tagsBox").onclick = e=>{const b=e.target.closest("[data-t]"); if(!b) return; tag=b.dataset.t; renderAll();};
$("songs").onclick = e=>{
  const mv=e.target.closest("[data-mv]"); if(mv){ e.stopPropagation(); moveSong(mv.dataset.mid, +mv.dataset.mv); return; }
  const rs=e.target.closest("[data-restore]"); if(rs){ const id=rs.dataset.restore; requireUnlock(async ()=>{ const {id:_i, ...rest}=byId[id]; delete rest.removed; await saveSong(id, rest, null, false); $("note").textContent=`Restored “${rest.n}”.`; }); return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ e.stopPropagation(); openEditor(ed.dataset.edit); return; }
  const l=e.target.closest("[data-l]"); if(l){ const el=document.getElementById("L-"+l.dataset.l); if(el) $("fullBody").scrollTo({top:el.offsetTop-$("fullBody").offsetTop,behavior:"smooth"}); return; }
  const b=e.target.closest("[data-id]"); if(!b) return;
  if(reorderOn){ selId=b.dataset.id; renderList(); return; }
  play(byId[b.dataset.id]);
};
$("songs").onkeydown = e=>{ if(e.key==="Enter" && e.target.matches(".song")) play(byId[e.target.dataset.id]); };
$("penNow").onclick = ()=>current&&openEditor(current.id);
$("q").oninput = e=>{q=e.target.value; renderList();};
const setMode = m=>{mode=m; store.set("gsv_mode",mode); cat="all"; tag="all"; renderAll();};
$("mFull").onclick = ()=>{ if(mode==="full") setMode("daily"); else { setMode("full"); $("q").focus(); } };
$("mMix").onclick = ()=>{ if(mode==="mix") setMode("daily"); else { if(!mix) shuffleWeek(); setMode("mix"); } };
$("reshuffle").onclick = ()=>{shuffleWeek(); renderAll();};
$("prev").onclick = ()=>step(-1);
$("next").onclick = ()=>step(1);
$("playAll").onclick = ()=> queue ? stopQueue() : startQueue();
$("shufBtn").onclick = ()=>{ shufOn=!shufOn; store.set("gsv_shuf",shufOn); renderCtl(); if(queue) startQueue(); };
$("repBtn").onclick = ()=>{
  repeat = {off:"all",all:"one",one:"off"}[repeat]; store.set("gsv_repeat",repeat); renderCtl();
  if(queue){ if(repeat==="one") $("note").textContent="Repeat one works on a single song; the list keeps playing through."; renderQueue(); }
  else if(current && ytId(links[current.id])) renderPlayer(true);
};

$("save").onclick = ()=>{
  if(!current) return;
  requireUnlock(async ()=>{
    const v = $("link").value.trim();
    if(v && !ytId(v)){ $("note").textContent = "That doesn't look like a YouTube video link. Copy the address of a video page and try again."; return; }
    if(v) links[current.id]=v; else delete links[current.id];
    store.set("gsv_links",links);
    $("note").textContent = v ? "Saved." : "Link removed.";
    if(db){ try{ v ? await db.doc("links/"+current.id).set({url:v}) : await db.doc("links/"+current.id).delete(); $("note").textContent = v?"Saved for everyone.":"Link removed."; }catch(e){ $("note").textContent = "Saved on this device only (shared save not allowed)."; } }
    renderPlayer(true); renderList();
  });
};
$("link").onkeydown = e=>{ if(e.key==="Enter") $("save").click(); };

renderAll(); renderPlayer(false); renderCtl();

/* ---------- shared data ---------- */
(async()=>{
  try{
    if(window.FB_DB) db = window.FB_DB;
    else { if(!window.claude || !claude.use) return; db = await claude.use("db"); }
    if(!db) return;
    db.collection("links").onSnapshot(snap=>{
      snap.docs.forEach(d=>{const u=d.data()&&d.data().url; if(u) links[d.id]=u;});
      snap.docChanges().forEach(c=>{ if(c.type==="removed") delete links[c.doc.id]; });
      store.set("gsv_links",links);
      renderList(); if(current && !document.querySelector(".screen iframe")) renderPlayer(false);
    });
    db.collection("plays").onSnapshot(snap=>{
      snap.docs.forEach(d=>{ const v=d.data(); if(v && typeof v.n==="number") plays[d.id]=Math.max(plays[d.id]||0, v.n); });
      store.set("gsv_plays",plays);
    });
    db.collection("order").onSnapshot(snap=>{
      snap.docs.forEach(d=>{ const v=d.data(); if(v && Array.isArray(v.ids)) orders[d.id]=v.ids; });
      store.set("gsv_order",orders); renderList();
    });
    db.collection("songs").onSnapshot(snap=>{
      snap.docs.forEach(d=>{ const v=d.data(); if(v) edits[d.id]=v; });
      store.set("gsv_edits",edits);
      rebuild(); renderAll(); if(current) renderPlayer(false);
    });
  }catch(e){}
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
